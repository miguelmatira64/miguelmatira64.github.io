<!-- Videography Section -->
<section class="mb-12">
    <div class="flex items-baseline justify-between mb-12">
        <h2 class="text-2xl font-headline font-bold tracking-tight">Videography Samples</h2>
        <div class="h-px flex-grow mx-8 bg-surface-container-highest"></div>
        <span class="text-on-surface-variant font-label text-xs uppercase tracking-widest">4K Video Projects</span>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
        <!-- Video Card 1 -->
        <div class="space-y-6">
            <div class="relative group aspect-video rounded-2xl overflow-hidden bg-on-surface ring-1 ring-on-surface/5">
                <video src="./assets/vid/promo.mp4" class="w-full h-full object-cover opacity-90 transition-opacity duration-300 group-hover:opacity-100" controls preload="none"></video>
                <div class="absolute bottom-6 left-6 right-6 flex justify-between items-center pointer-events-none">
                    <span class="bg-black/50 backdrop-blur-md text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-wider">4K Promo</span>
                </div>
            </div>
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-headline font-bold text-xl">Promo Video</h3>
                    <p class="text-on-surface-variant text-sm mt-1">Short Format • Commercial</p>
                </div>
                <button class="bg-surface-container-low hover:bg-surface-container-high p-3 rounded-xl transition-colors">
                    <span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
                </button>
            </div>
            <!-- Metadata Strip -->
            <div class="flex flex-wrap gap-3">
                <span class="bg-surface-container-high px-3 py-1.5 rounded-lg text-xs font-label text-on-surface-variant">iPhone 16 Plus</span>
                <span class="bg-surface-container-high px-3 py-1.5 rounded-lg text-xs font-label text-on-surface-variant">Rec. 709</span>
                <span class="bg-surface-container-high px-3 py-1.5 rounded-lg text-xs font-label text-on-surface-variant">4K Resolution</span>
            </div>
        </div>
        <!-- Video Card 2 -->
        <div class="space-y-6">
            <div class="relative group aspect-video rounded-2xl overflow-hidden bg-on-surface ring-1 ring-on-surface/5">
                <video src="./assets/vid/dtc.mov" class="w-full h-full object-cover opacity-90 transition-opacity duration-300 group-hover:opacity-100" controls preload="none"></video>
                <div class="absolute bottom-6 left-6 right-6 flex justify-between items-center pointer-events-none">
                    <span class="bg-black/50 backdrop-blur-md text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-wider">4K Doc</span>
                </div>
            </div>
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-headline font-bold text-xl">DTC Project</h3>
                    <p class="text-on-surface-variant text-sm mt-1">Event Visuals • Documentary</p>
                </div>
                <button class="bg-surface-container-low hover:bg-surface-container-high p-3 rounded-xl transition-colors">
                    <span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
                </button>
            </div>
            <!-- Metadata Strip -->
            <div class="flex flex-wrap gap-3">
                <span class="bg-surface-container-high px-3 py-1.5 rounded-lg text-xs font-label text-on-surface-variant">DJI Osmo Pocket 3</span>
                <span class="bg-surface-container-high px-3 py-1.5 rounded-lg text-xs font-label text-on-surface-variant">D-Log</span>
                <span class="bg-surface-container-high px-3 py-1.5 rounded-lg text-xs font-label text-on-surface-variant">4K Resolution</span>
            </div>
        </div>
    </div>
</section>
